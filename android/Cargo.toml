[package]
name = "agss-android"
version = "0.1.0"
edition = "2021"
description = "AutoGameSoftwareSync pour consoles portables Android : coffre partage avec le PC, versions immuables, remonter le temps."
publish = false

[lib]
name = "agss_android"
crate-type = ["cdylib"]

[dependencies]
# Moteur partage avec le PC (coffre, versions, profils, copies de securite, textes des 5 langues).
agss = { path = "..", package = "autogamesoftwaresync" }
egui = "0.31"
egui-phosphor = { version = "0.9", default-features = false, features = ["regular"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
android_logger = "0.14"
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"

# Hors Android (tests sur PC) : meme eframe, sans la partie Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.android]
package = "io.github.epikou.agss"
# versionCode : calcule par cargo-apk depuis la version du paquet (0.1.0 -> 16777472), croissant a chaque version.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
apk_name = "AutoGameSoftwareSync"
resources = "res"

# cargo-apk exige une cle pour `--release` : tools/build-android.ps1 lui donne la cle de DEBOGAGE standard du SDK (mot de
# passe public « android ») par les variables CARGO_APK_RELEASE_KEYSTORE / _PASSWORD, puis re-signe l'APK avec la vraie cle
# release (apksigner). Aucun chemin local ni secret dans ce fichier.

# Android 11 (API 30) minimum : stockage cloisonne en dessous, l'appli ne verrait ni les emulateurs ni le coffre.
[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.application]
label = "AutoGameSoftwareSync"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode|navigation|keyboard"
orientation = "sensorLandscape"
launch_mode = "singleTask"

# winit : copie locale modifiee (manette des consoles portables), voir vendor/winit/VENDOR-NOTE.md.
[patch.crates-io]
winit = { path = "vendor/winit" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
