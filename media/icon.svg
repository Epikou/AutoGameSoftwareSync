<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AutoGameSoftwareSync : disquette verte (#028463) + manette + fleches de synchronisation -->
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08a07a"/>
      <stop offset="0.55" stop-color="#028463"/>
      <stop offset="1" stop-color="#016048"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e9ef"/>
      <stop offset="0.5" stop-color="#b9c0cc"/>
      <stop offset="1" stop-color="#8f98a8"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Disquette -->
  <g filter="url(#shadow)">
    <path d="M60 36 H392 L452 96 V420 Q452 452 420 452 H92 Q60 452 60 420 V68 Q60 36 92 36 Z"
          fill="url(#disk)" stroke="#013f30" stroke-width="8"/>
  </g>
  <!-- Volet metal -->
  <rect x="140" y="36" width="210" height="130" rx="10" fill="url(#metal)" stroke="#5c6575" stroke-width="6"/>
  <rect x="268" y="58" width="50" height="86" rx="6" fill="#016048"/>
  <!-- Etiquette -->
  <rect x="100" y="206" width="312" height="214" rx="14" fill="#f4f1e8" stroke="#c9c3b2" stroke-width="4"/>
  <rect x="124" y="226" width="264" height="10" rx="5" fill="#d9d2bf"/>

  <!-- Manette (reduite, a gauche pour laisser la place au badge) -->
  <g transform="translate(26 118) scale(0.8)">
    <g filter="url(#shadow)">
      <path d="M150 268 H362 Q420 268 440 330 L466 420 Q480 476 436 482 Q408 486 386 452 L362 414 H150 L126 452 Q104 486 76 482 Q32 476 46 420 L72 330 Q92 268 150 268 Z"
            fill="url(#pad)" stroke="#0b0c0f" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g fill="#e6e9ef">
      <rect x="114" y="314" width="22" height="66" rx="5"/>
      <rect x="92" y="336" width="66" height="22" rx="5"/>
    </g>
    <circle cx="380" cy="320" r="15" fill="#4ade80"/>
    <circle cx="410" cy="349" r="15" fill="#f87171"/>
    <circle cx="350" cy="349" r="15" fill="#fbbf24"/>
    <circle cx="380" cy="378" r="15" fill="#facc15"/>
    <rect x="216" y="326" width="30" height="12" rx="6" fill="#8f98a8"/>
    <rect x="266" y="326" width="30" height="12" rx="6" fill="#8f98a8"/>
  </g>

  <!-- Badge de synchronisation : deux fleches en arc -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="396" r="90" fill="#ffffff" stroke="#016048" stroke-width="8"/>
  </g>
  <g fill="none" stroke="#028463" stroke-width="18" stroke-linecap="round">
    <path d="M351 382 A52 52 0 0 1 449 382"/>
    <path d="M449 410 A52 52 0 0 1 351 410"/>
  </g>
  <g fill="#028463">
    <path d="M454 394 L474 366 L430 372 Z"/>
    <path d="M346 398 L326 426 L370 420 Z"/>
  </g>
</svg>
