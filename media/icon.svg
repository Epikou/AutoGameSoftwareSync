<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AutoGameSoftwareSync 2.0.3 : disquette verte (#028463), manette, badge de synchronisation.
       Style plat (aucune ombre portee : floue aux petites tailles), formes epaisses, contrastes nets.
       Variante 48 px et plus ; voir icon_small.svg (24-32) et icon_tiny.svg (16). -->
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a9a74"/>
      <stop offset="1" stop-color="#027257"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3d52"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
  </defs>

  <!-- Disquette : corps, coin coupe en haut a droite, bord inferieur plus sombre (relief discret) -->
  <path d="M96 40 H392 L472 120 V416 Q472 472 416 472 H96 Q40 472 40 416 V96 Q40 40 96 40 Z" fill="url(#disk)"/>
  <path d="M40 404 V416 Q40 472 96 472 H416 Q472 472 472 416 V404 Q472 456 416 456 H96 Q40 456 40 404 Z" fill="#015a44"/>
  <!-- Volet metal et sa fente -->
  <path d="M152 40 H360 V148 Q360 160 348 160 H164 Q152 160 152 148 Z" fill="#e4e8ef"/>
  <rect x="296" y="62" width="40" height="76" rx="8" fill="#027257"/>
  <!-- Etiquette -->
  <rect x="88" y="200" width="336" height="228" rx="20" fill="#f3f1ea"/>

  <!-- Manette (silhouette pleine, meme famille que l'icone « Manette » de l'interface) -->
  <g transform="translate(136 258) scale(0.8)">
    <path d="M64 0 H176 C212 0 232 24 238 62 L250 118 C254 142 230 156 212 140 L178 104 H62 L28 140 C10 156 -14 142 -10 118 L2 62 C8 24 28 0 64 0 Z"
          fill="url(#pad)"/>
    <!-- croix directionnelle -->
    <rect x="50" y="30" width="24" height="52" rx="5" fill="#f3f1ea"/>
    <rect x="36" y="44" width="52" height="24" rx="5" fill="#f3f1ea"/>
    <!-- deux boutons -->
    <circle cx="170" cy="42" r="11" fill="#f3f1ea"/>
    <circle cx="194" cy="62" r="11" fill="#f3f1ea"/>
    <!-- boutons du milieu -->
    <rect x="102" y="52" width="16" height="10" rx="5" fill="#8f9bb0"/>
    <rect x="124" y="52" width="16" height="10" rx="5" fill="#8f9bb0"/>
  </g>

  <!-- Badge de synchronisation : deux fleches en arc dans un disque blanc -->
  <circle cx="416" cy="416" r="86" fill="#ffffff" stroke="#015a44" stroke-width="10"/>
  <g fill="none" stroke="#028463" stroke-width="20" stroke-linecap="butt">
    <path d="M371 400 A48 48 0 0 1 461 400"/>
    <path d="M461 432 A48 48 0 0 1 371 432"/>
  </g>
  <g fill="#028463">
    <path d="M468 419 L476 388 L442 400 Z"/>
    <path d="M364 413 L356 444 L390 432 Z"/>
  </g>
</svg>
