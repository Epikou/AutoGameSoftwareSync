<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Variante 24-32 px : memes elements (disquette, manette, badge), details retires, formes plus epaisses.
       Grille : 1 px = 16 unites a 32 px. -->
  <defs>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a9a74"/>
      <stop offset="1" stop-color="#027257"/>
    </linearGradient>
  </defs>
  <path d="M96 32 H384 L480 128 V416 Q480 480 416 480 H96 Q32 480 32 416 V96 Q32 32 96 32 Z" fill="url(#disk)"/>
  <path d="M144 32 H368 V144 Q368 160 352 160 H160 Q144 160 144 144 Z" fill="#e4e8ef"/>
  <rect x="296" y="56" width="40" height="72" rx="8" fill="#027257"/>
  <rect x="72" y="192" width="368" height="248" rx="24" fill="#f3f1ea"/>

  <!-- Manette : silhouette pleine + croix -->
  <g transform="translate(70 246) scale(0.9)">
    <path d="M64 0 H176 C212 0 232 24 238 62 L250 118 C254 142 230 156 212 140 L178 104 H62 L28 140 C10 156 -14 142 -10 118 L2 62 C8 24 28 0 64 0 Z"
          fill="#243244"/>
    <rect x="48" y="26" width="28" height="60" rx="6" fill="#f3f1ea"/>
    <rect x="32" y="42" width="60" height="28" rx="6" fill="#f3f1ea"/>
    <circle cx="176" cy="40" r="13" fill="#f3f1ea"/>
    <circle cx="200" cy="64" r="13" fill="#f3f1ea"/>
  </g>

  <!-- Badge de synchronisation (plus grand qu'en 48+ : il doit rester lisible) -->
  <circle cx="400" cy="400" r="104" fill="#ffffff" stroke="#015a44" stroke-width="12"/>
  <g fill="none" stroke="#028463" stroke-width="30" stroke-linecap="butt">
    <path d="M347 381 A56 56 0 0 1 453 381"/>
    <path d="M453 419 A56 56 0 0 1 347 419"/>
  </g>
  <g fill="#028463">
    <path d="M463 407 L474 367 L428 383 Z"/>
    <path d="M337 393 L326 433 L372 417 Z"/>
  </g>
</svg>
